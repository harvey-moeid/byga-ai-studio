name: Deploy staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: byga-ai-studio-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify, migrate isolated staging D1 and deploy staging Worker
    if: startsWith(github.ref, 'refs/heads/feat/')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: '1'
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Quality gates
        run: npm run check
      - name: Apply migrations to isolated staging D1 only
        working-directory: apps/api
        run: npx wrangler d1 migrations apply DB --remote --env staging
      - name: Deploy isolated staging Worker
        working-directory: apps/api
        run: npx wrangler deploy --env staging
