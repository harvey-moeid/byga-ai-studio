name: D1 migrations

# Manual only. Applies additive SQL files from apps/api/migrations to the production D1 database.
# Never triggered by push/PR. The `production` environment must have required reviewers.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only list pending migrations; do not apply them'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: d1-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: ${{ inputs.dry_run && 'List pending D1 migrations' || 'Apply D1 migrations' }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CI: '1'
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: List migrations (remote)
        working-directory: apps/api
        run: npx wrangler d1 migrations list DB --remote
      - name: Apply migrations (remote)
        if: ${{ !inputs.dry_run }}
        working-directory: apps/api
        run: npx wrangler d1 migrations apply DB --remote
      - name: List migrations after apply (remote)
        if: ${{ !inputs.dry_run }}
        working-directory: apps/api
        run: npx wrangler d1 migrations list DB --remote
